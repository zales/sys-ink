name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  ZIG_VERSION: 0.17.0

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Unit tests
        run: zig build test --summary all

      # The mode releases are built in, where the optimiser has had its say.
      - name: Unit tests, optimised as released
        run: zig build test -Doptimize=safe --summary all

      # The daemon itself, for the host's architecture and for both targets a
      # release is built for. The tests cannot stand in for this: they run on
      # one architecture, and the ARMv6 build has failed where they passed.
      - name: Type-check for every release target
        run: zig build check

      - name: Formatting
        run: zig fmt --check src build.zig
