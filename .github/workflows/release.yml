name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  ZIG_VERSION: 0.16.0

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Unit tests
        run: zig build test --summary all

      - name: Type-check Linux-only modules
        run: zig build check

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: aarch64-linux-musl
            deb_arch: arm64
            asset_name: sys-ink-aarch64
          - target: arm-linux-musleabihf
            deb_arch: armhf
            asset_name: sys-ink-armhf

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build for ${{ matrix.target }}
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSmall

      - name: Package Debian (.deb)
        env:
          TARGET_ARCH: ${{ matrix.deb_arch }}
          BINARY_PATH: zig-out/bin/sys-ink
        run: |
          VERSION=${{ github.ref_name }}
          export VERSION=${VERSION#v}   # strip the leading 'v'
          chmod +x package_deb.sh
          ./package_deb.sh

      - name: Rename binary
        run: mv zig-out/bin/sys-ink ${{ matrix.asset_name }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.deb_arch }}
          path: |
            ${{ matrix.asset_name }}
            *.deb
          if-no-files-found: error

  release:
    # Single job so the matrix builds cannot race each other creating the
    # release and overwriting its body.
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: build-*
          merge-multiple: true

      - name: Generate changelog
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || echo "")
          echo "Generating changelog from ${PREVIOUS_TAG:-the beginning} to ${{ github.ref_name }}"

          {
            echo "Changes in this release:"
            echo
            if [ -z "$PREVIOUS_TAG" ]; then
              git log --pretty=format:"- %s (%h)" "${{ github.ref_name }}"
            else
              git log --pretty=format:"- %s (%h)" "${PREVIOUS_TAG}..${{ github.ref_name }}"
            fi
          } > changelog.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          name: Release ${{ github.ref_name }}
          body_path: changelog.txt
          draft: false
          prerelease: false

  deploy-repository:
    name: Deploy APT repository
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Empty unless the repository defines the secret; used to decide whether
      # the APT metadata can be signed.
      APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: build-*
          merge-multiple: true

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Create repository structure
        run: |
          mkdir -p public
          cp artifacts/*.deb public/
          # Guarded with if/fi: a bare "[ -f x ] && cp" would fail the whole
          # step under `set -e` whenever the file is absent.
          if [ -f docs/index.html ]; then cp docs/index.html public/; fi

          cd public
          touch .nojekyll   # disable Jekyll processing on GitHub Pages

          dpkg-scanpackages -m . /dev/null > Packages
          gzip -k -f Packages

          {
            echo "Origin: SysInk"
            echo "Label: SysInk Repo"
            echo "Suite: stable"
            echo "Codename: stable"
            echo "Architectures: arm64 armhf"
            echo "Components: main"
            echo "Description: SysInk Debian Repository"
            echo "Date: $(date -Ru)"
            echo "MD5Sum:"
            for f in Packages Packages.gz; do
              echo " $(md5sum "$f" | cut -d' ' -f1) $(stat -c%s "$f") $f"
            done
            echo "SHA256:"
            for f in Packages Packages.gz; do
              echo " $(sha256sum "$f" | cut -d' ' -f1) $(stat -c%s "$f") $f"
            done
          } > Release

      - name: Sign repository
        if: ${{ env.APT_GPG_PRIVATE_KEY != '' }}
        run: |
          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')

          cd public
          gpg --batch --yes --default-key "$KEY_ID" --armor --detach-sign -o Release.gpg Release
          gpg --batch --yes --default-key "$KEY_ID" --clearsign -o InRelease Release
          # Public key for /etc/apt/keyrings, so clients can verify.
          gpg --export "$KEY_ID" > sys-ink-archive-keyring.gpg

          echo "APT repository signed with $KEY_ID"

      - name: Warn when unsigned
        if: ${{ env.APT_GPG_PRIVATE_KEY == '' }}
        run: |
          echo "::warning::APT_GPG_PRIVATE_KEY is not set — publishing an UNSIGNED repository." \
               "Clients must use [trusted=yes], which disables authentication of downloaded packages."

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true
